name: Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Dependencies
        run: npm install

      - name: Build Application
        run: npm run make

      # Linux artifacts (separated)
      - name: Upload Debian Package (.deb)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: image-prompt-viewer-linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          retention-days: 5

      - name: Upload RPM Package (.rpm)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: image-prompt-viewer-linux-rpm
          path: src-tauri/target/release/bundle/rpm/*.rpm
          retention-days: 5

      - name: Upload AppImage Package (.AppImage)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: image-prompt-viewer-linux-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 5

      # macOS artifacts (.dmg)
      - name: Upload macOS DMG (.dmg)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v7
        with:
          name: image-prompt-viewer-macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 5

      # Windows artifacts (.exe & .msi separated)
      - name: Upload Windows Setup (.exe)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: image-prompt-viewer-windows-exe
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 5

      - name: Upload Windows Installer (.msi)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: image-prompt-viewer-windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          retention-days: 5

      # Attach individual installer assets to GitHub Release on tag push
      - name: Release to GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          fail_on_unmatched_files: false
